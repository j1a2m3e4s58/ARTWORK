services:
  - type: web
    name: reigns-atelier
    runtime: node
    plan: free
    region: frankfurt
    # Persistence and scheduled jobs are intentionally single-instance until
    # all mutation paths have moved to direct transactional repositories.
    numInstances: 1
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: SITE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REQUIRE_ADMIN_MFA
        value: "true"
      - key: SEED_DEMO_CONTENT
        value: "false"
      - key: BOOTSTRAP_PORTFOLIO_CONTENT
        value: "true"
      - key: DATABASE_URL
        # Set this secret in the Render dashboard to the pooled Neon URL
        # (the hostname contains "-pooler"). Never commit the URL/password.
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: SMTP_MAX_CONNECTIONS
        value: "3"
      - key: EMAIL_REQUIRED_FOR_READINESS
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: PAYMENT_CURRENCY
        value: GHS
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: SHIPPING_FLAT_RATE
        value: "0"
      - key: METRICS_TOKEN
        generateValue: true
      - key: ERROR_WEBHOOK_URL
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0"
      - key: BACKUP_VERIFIED_AT
        sync: false
      - key: LOG_REQUESTS
        value: "true"
      - key: ALLOW_STARTER_MEDIA
        value: "false"
      - key: EMAIL_LOG_RETENTION_DAYS
        value: "90"
      - key: BACKGROUND_JOBS_ENABLED
        value: "true"
      - key: JOB_WORKER_DRAIN_DELAY_SECONDS
        value: "300"
      - key: JOB_WORKER_STALLED_INTERVAL_MS
        value: "300000"
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      - key: TURN_URLS
        sync: false
      - key: TURN_USERNAME
        sync: false
      - key: TURN_CREDENTIAL
        sync: false
      - key: TURN_SHARED_SECRET
        sync: false
