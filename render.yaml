services:
  - type: web
    name: reigns-atelier
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "true"
      - key: APP_ORIGIN
        sync: false
      - key: SITE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: REQUIRE_ADMIN_MFA
        value: "true"
      - key: SEED_DEMO_CONTENT
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: reigns-atelier-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_POOL_SIZE
        value: "5"
      - key: STORAGE_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false
      - key: SMTP_MAX_CONNECTIONS
        value: "3"
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: manual
      - key: PAYMENT_CURRENCY
        value: GHS
      - key: SHIPPING_FLAT_RATE
        value: "0"
      - key: METRICS_TOKEN
        generateValue: true
      - key: LOG_REQUESTS
        value: "true"
      - key: ERROR_WEBHOOK_URL
        sync: false
      - key: ALLOW_STARTER_MEDIA
        value: "false"
      - key: EMAIL_LOG_RETENTION_DAYS
        value: "90"

databases:
  - name: reigns-atelier-db
    plan: free
    region: frankfurt
    databaseName: reigns_atelier
    user: reigns_atelier
    ipAllowList: []
